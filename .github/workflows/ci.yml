name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Skip the optional, heavy transformers classifier dep; it is not needed to typecheck,
      # lint, test, or build (its import is runtime-only and bundler-ignored).
      - run: npm ci --omit=optional
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
