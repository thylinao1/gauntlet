name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Full install. Do NOT use --omit=optional here: it also drops Rollup's platform binary
      # (@rollup/rollup-linux-x64-gnu) that vitest/vite needs. The optional transformers classifier
      # is allowed to install; if it ever fails it is non-fatal (optionalDependencies).
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
